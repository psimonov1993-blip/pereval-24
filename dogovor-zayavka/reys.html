<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Карточка рейса · Перевал 24</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--ink:#15181d;--muted:#6a7280;--line:#dde1e6;
        --accent:#c8102e;--ok:#1c7c3c;--warn:#a05a00;--field:#fcfcfd}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  header{background:#15181d;color:#fff;padding:16px}
  header h1{margin:0;font-size:17px}
  header p{margin:5px 0 0;color:#a8b0ba;font-size:13px}
  main{max-width:820px;margin:0 auto;padding:16px 16px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:14px 0}
  .card h2{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.6px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;
    background:var(--field);font:inherit;font-size:15px}
  button{font:inherit;font-size:14px;padding:10px 14px;border-radius:8px;border:1px solid var(--line);
    background:#fff;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button:disabled{opacity:.5;cursor:default}
  .row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .grid{display:grid;gap:12px}
  @media(min-width:640px){.grid.two{grid-template-columns:1fr 1fr}}
  table.kv{width:100%;border-collapse:collapse;font-size:14px}
  table.kv td{padding:6px 0;vertical-align:top;border-bottom:1px solid #f0f2f4}
  table.kv td:first-child{color:var(--muted);width:42%}
  .docs{list-style:none;padding:0;margin:10px 0 0}
  .docs li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #f0f2f4;font-size:14px}
  .docs .meta{color:var(--muted);font-size:13px}
  .pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .pill.ok{color:var(--ok);border-color:#bfe3cb;background:#f2fbf5}
  .pill.no{color:var(--warn);border-color:#f0dcc0;background:#fdf8f1}
  .note{font-size:13px;color:var(--muted);margin-top:10px}
  .flash{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:#15181d;color:#fff;
    padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;z-index:30}
  .flash.on{opacity:1}
  .hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>Карточка рейса</h1>
  <p>Договор-заявка и документы от водителя в одном месте</p>
</header>

<main>
  <div class="card" id="authCard">
    <h2>Доступ</h2>
    <div class="grid two">
      <div><label for="key">Ключ доступа</label><input id="key" type="password" placeholder="тот же, что в форме договора"></div>
      <div><label for="who">Ваше имя</label><input id="who" placeholder="Кристина или ФИО водителя"></div>
    </div>
    <div class="row-btns"><button type="button" class="primary" id="btnAuth">Войти</button></div>
    <p class="note" id="authNote">Ключ запомнится в этом браузере</p>
  </div>

  <div class="card hidden" id="pickCard">
    <h2>Рейс</h2>
    <div class="grid two">
      <div><label for="trip">Номер рейса</label><input id="trip" placeholder="Р-007"></div>
      <div style="align-self:end"><button type="button" id="btnOpen">Открыть карточку</button></div>
    </div>
    <p class="note" id="tripsNote"></p>
  </div>

  <div class="card hidden" id="tripCard">
    <h2 id="tripTitle">Рейс</h2>
    <table class="kv" id="tripKv"></table>
  </div>

  <div class="card hidden" id="contractCard">
    <h2>Договор-заявка</h2>
    <div id="contractBody"></div>
    <div class="row-btns" id="contractBtns"></div>
  </div>

  <div class="card hidden" id="docsCard">
    <h2>Документы от водителя</h2>
    <p class="note" id="docsHint">Сканы транспортных накладных. Фотографируйте так, чтобы читались номер, дата и отметки о погрузке и выгрузке</p>
    <ul class="docs" id="docsList"></ul>
    <div class="grid two" style="margin-top:14px">
      <div><label for="docKind">Что за документ</label>
        <select id="docKind">
          <option>ТН</option><option>ТТН</option><option>Товарная накладная</option>
          <option>УПД</option><option>Путевой лист</option><option>Фото груза</option><option>Другое</option>
        </select>
      </div>
      <div><label for="docFile">Файл или фото</label>
        <input type="file" id="docFile" accept="image/*,application/pdf" capture="environment"></div>
    </div>
    <div class="row-btns">
      <button type="button" class="primary" id="btnUpload" disabled>Загрузить документ</button>
    </div>
    <p class="note" id="uploadNote"></p>
  </div>
</main>

<div class="flash" id="flash"></div>

<script src="docx-gen.js"></script>
<script>
(function(){
  'use strict';
  var API='https://terminator.pw/webhook/pv24-reysy';
  var $=function(id){return document.getElementById(id);};
  var state={trip:null, contract:null, docs:[]};

  var LS={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},
          set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

  function flash(m){var f=$('flash');f.textContent=m;f.classList.add('on');
    clearTimeout(flash.t);flash.t=setTimeout(function(){f.classList.remove('on');},2600);}

  function api(payload){
    return fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(Object.assign({key:$('key').value.trim(), author:$('who').value.trim()},payload))
    }).then(function(r){return r.json();});
  }

  function show(id,on){ $(id).classList[on?'remove':'add']('hidden'); }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function row(k,v){ return v? '<tr><td>'+esc(k)+'</td><td>'+esc(v)+'</td></tr>' : ''; }

  function renderTrip(){
    var t=state.trip||{};
    $('tripTitle').textContent='Рейс '+(t.id||'');
    $('tripKv').innerHTML =
      row('Дата', t.date)+row('Заказчик', t.customer)+row('ИНН заказчика', t.customerInn)+
      row('Маршрут', t.route)+row('Груз', t.cargo)+row('Водитель', t.driver)+
      row('Машина', t.vehicle)+row('Ставка заказчика', t.price)+row('Статус', t.status)+
      row('Кто вёл', t.author)+row('Обновлено', t.updatedAt);
    show('tripCard', true);
  }

  function renderContract(){
    var c=state.contract;
    var body=$('contractBody'), btns=$('contractBtns');
    btns.innerHTML='';
    if(!c){
      body.innerHTML='<span class="pill no">договора нет</span>'+
        '<p class="note">Договор создаётся из таблицы учёта рейсов или кнопкой ниже. Номер присваивается сквозной</p>';
      var b=document.createElement('button');
      b.className='primary'; b.textContent='Создать договор-заявку';
      b.onclick=createContract; btns.appendChild(b);
    } else {
      var p=c.payload||{};
      body.innerHTML='<table class="kv">'+
        row('Номер', '№ '+c.number)+row('Дата', c.date)+row('Заказчик', p.customerName)+
        row('Маршрут', p.route)+row('Груз', p.cargo)+row('Стоимость', p.price)+
        row('Создал', c.author)+row('Когда', c.createdAt)+'</table>';
      var d=document.createElement('button');
      d.className='primary'; d.textContent='Скачать договор в Word'; d.onclick=downloadContract;
      var e=document.createElement('button');
      e.textContent='Открыть в форме и дополнить';
      e.onclick=function(){ location.href='../dogovor-zayavka/#d='+encodeFromContract(c); };
      btns.appendChild(d); btns.appendChild(e);
    }
    show('contractCard', true);
  }

  function encodeFromContract(c){
    var p=c.payload||{}, t=state.trip||{};
    var data={number:c.number, date:c.date, route:p.route||t.route, cargo:p.cargo||t.cargo,
      price:p.price||t.price, loadAddress:p.loadAddress||'', unloadAddress:p.unloadAddress||'',
      loadDate:p.loadDate||'', unloadDate:p.unloadDate||'', loadContact:p.loadContact||'',
      unloadContact:p.unloadContact||'', driverName:p.driverName||t.driver||'',
      vehicle:p.vehicle||t.vehicle||'', pName:p.customerName||t.customer||'', pInn:p.customerInn||t.customerInn||''};
    var bytes=new TextEncoder().encode(JSON.stringify(data)), bin='';
    bytes.forEach(function(b){ bin+=String.fromCharCode(b); });
    return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }

  function downloadContract(){
    var c=state.contract, p=(c&&c.payload)||{}, t=state.trip||{};
    var data={
      number:c.number, date:c.date, route:p.route||t.route,
      loadAddress:p.loadAddress||'', loadDate:p.loadDate||'', loadContact:p.loadContact||'',
      unloadAddress:p.unloadAddress||'', unloadDate:p.unloadDate||'', unloadContact:p.unloadContact||'',
      cargo:p.cargo||t.cargo||'', bodyType:p.bodyType||'Борт, верхняя погрузка/выгрузка',
      note:p.note||'', price:p.price||t.price||'', payment:p.payment||'По скану ТН 5-7 банковских дней',
      driverName:p.driverName||t.driver||'', driverPhone:p.driverPhone||'',
      driverPassport:p.driverPassport||'', vehicle:p.vehicle||t.vehicle||'',
      customer:{name:p.customerName||t.customer||'', inn:p.customerInn||t.customerInn||'',
                ogrn:p.customerOgrn||'', address:p.customerAddress||'', phone:p.customerPhone||'',
                email:p.customerEmail||'', account:p.customerAccount||'', bank:p.customerBank||'',
                bik:p.customerBik||'', corr:p.customerCorr||''},
      executor:{name:'Индивидуальный предприниматель Рамазанов Нариман Джафарович',
                inn:'151000641307', ogrn:'316774600494322',
                address:'117624, г. Москва, ул. Поляны, д. 5А, к. 2, кв. 774',
                phone:'+7 968 441-88-85', email:'buhoffice@palletstandart.ru',
                account:'40802810844100000509', bank:'Филиал «Центральный» Банка ВТБ (ПАО)',
                bik:'044525411', corr:'30101810145250000411'},
      terms: DocxGen.TERMS_EXECUTOR
    };
    var sig=LS.get('pv24_signature', null);
    if(sig && sig.dataUrl){
      try{
        var bin=atob(sig.dataUrl.split(',')[1]), bytes=new Uint8Array(bin.length);
        for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
        var w=Math.round(3.5*360000);
        data.signature={bytes:bytes, ext:sig.ext, widthEmu:w, heightEmu:Math.round(w*(sig.h/sig.w)), side:'executor'};
      }catch(e){}
    }
    var blob=new Blob([DocxGen.buildDocx(data)],
      {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='Договор-заявка-'+c.number+'-'+(state.trip? state.trip.id : '')+'.docx';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500);
    flash(sig? 'Договор собран и подписан факсимиле' : 'Договор собран. Подпись не загружена, её добавляют в форме');
  }

  function createContract(){
    var t=state.trip||{};
    flash('Создаю договор…');
    api({action:'contract.create', trip:t.id, contract:{
      customerName:t.customer||'', customerInn:t.customerInn||'', route:t.route||'',
      cargo:t.cargo||'', price:t.price||'', driverName:t.driver||'', vehicle:t.vehicle||''
    }}).then(function(res){
      if(!res || !res.ok){ flash((res&&res.error)||'База не приняла'); return; }
      state.contract=res.contract; renderContract();
      flash('Договор № '+res.contract.number+' создан');
    }).catch(function(){ flash('Сервер недоступен'); });
  }

  function renderDocs(){
    var ul=$('docsList');
    if(!state.docs.length){
      ul.innerHTML='<li><span class="meta">документов пока нет</span></li>';
    } else {
      ul.innerHTML=state.docs.map(function(d){
        return '<li><span><strong>'+esc(d.kind)+'</strong><br><span class="meta">'+esc(d.name)+'</span></span>'+
               '<span class="meta">'+esc(d.author||'')+'<br>'+esc(d.at||'')+'</span></li>';
      }).join('');
    }
    show('docsCard', true);
  }

  // фото со смартфона ужимаем, чтобы не гонять 5 МБ по мобильному интернету
  function shrink(file){
    return new Promise(function(resolve){
      if(file.type==='application/pdf' || file.size<300*1024){
        var fr=new FileReader();
        fr.onload=function(){ resolve(fr.result); };
        fr.readAsDataURL(file); return;
      }
      var fr2=new FileReader();
      fr2.onload=function(){
        var img=new Image();
        img.onload=function(){
          var max=1600, k=Math.min(1, max/Math.max(img.width,img.height));
          var c=document.createElement('canvas');
          c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          resolve(c.toDataURL('image/jpeg',0.75));
        };
        img.onerror=function(){ resolve(fr2.result); };
        img.src=fr2.result;
      };
      fr2.readAsDataURL(file);
    });
  }

  $('docFile').addEventListener('change', function(){
    $('btnUpload').disabled = !(this.files && this.files[0]);
    if(this.files && this.files[0]){
      $('uploadNote').textContent='Выбран файл '+this.files[0].name+', '+Math.round(this.files[0].size/1024)+' КБ';
    }
  });

  $('btnUpload').addEventListener('click', function(){
    var f=$('docFile').files[0];
    if(!f || !state.trip){ return; }
    $('btnUpload').disabled=true;
    $('uploadNote').textContent='Готовлю файл…';
    shrink(f).then(function(dataUrl){
      $('uploadNote').textContent='Отправляю, '+Math.round(dataUrl.length/1400)+' КБ…';
      return api({action:'doc.add', trip:state.trip.id, kind:$('docKind').value,
                  name:f.name, file_base64:dataUrl});
    }).then(function(res){
      if(res && res.ok){
        state.docs=res.docs||state.docs; state.contract=res.contract||state.contract;
        renderDocs();
        $('docFile').value=''; $('uploadNote').textContent='Документ загружен и сохранён';
        flash('Документ прикреплён к рейсу '+state.trip.id);
      } else {
        $('uploadNote').textContent=(res&&res.error)||'База не приняла файл';
        flash('Не загрузилось');
      }
      $('btnUpload').disabled=false;
    }).catch(function(){
      $('uploadNote').textContent='Сервер недоступен, попробуйте ещё раз';
      $('btnUpload').disabled=false;
    });
  });

  function openTrip(id){
    if(!id){ flash('Впишите номер рейса'); return; }
    flash('Открываю рейс…');
    api({action:'trip.card', trip:id}).then(function(res){
      if(!res || !res.ok){ flash((res&&res.error)||'Рейс не найден'); return; }
      state.trip=res.trip || {id:id};
      state.contract=res.contract; state.docs=res.docs||[];
      renderTrip(); renderContract(); renderDocs();
      history.replaceState(null,'', location.pathname+'?id='+encodeURIComponent(id));
    }).catch(function(){ flash('Сервер недоступен'); });
  }

  function loadList(){
    api({action:'trip.list'}).then(function(res){
      if(!res || !res.ok) return;
      var c=res.counts||{};
      $('tripsNote').textContent='В базе рейсов '+(c.trips||0)+', договоров '+(c.contracts||0)+
        ', документов '+(c.docs||0)+
        (res.trips && res.trips.length ? '. Последние: '+res.trips.slice(-5).map(function(t){
          return t.id+(t.contract? ' (дог. '+t.contract+')':''); }).join(', ') : '');
    }).catch(function(){});
  }

  $('btnAuth').addEventListener('click', function(){
    if(!$('key').value.trim()){ flash('Впишите ключ'); return; }
    LS.set('pv24_book_key', $('key').value.trim());
    LS.set('pv24_book_author', $('who').value.trim());
    api({action:'trip.list'}).then(function(res){
      if(res && res.ok){
        show('pickCard', true);
        $('authNote').textContent='Доступ есть. Ключ сохранён в этом браузере';
        loadList();
        var id=new URLSearchParams(location.search).get('id');
        if(id){ $('trip').value=id; openTrip(id); }
      } else flash((res&&res.error)||'Ключ не подошёл');
    }).catch(function(){ flash('Сервер недоступен'); });
  });

  $('btnOpen').addEventListener('click', function(){ openTrip($('trip').value.trim()); });

  // старт
  $('key').value=LS.get('pv24_book_key','')||'';
  $('who').value=LS.get('pv24_book_author','')||'';
  var qid=new URLSearchParams(location.search).get('id');
  if(qid) $('trip').value=qid;
  if($('key').value) $('btnAuth').click();
})();
</script>
</body>
</html>
