<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1f6fd0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Перевал 24</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>

<header>
  <button class="back" id="back" style="display:none" aria-label="Назад">‹</button>
  <h1><span id="title">Перевал 24</span><span class="sub" id="sub"></span></h1>
  <button class="act" id="act" style="display:none"></button>
</header>

<main id="main"></main>

<nav id="nav"></nav>

<div id="toast"></div>

<div id="gate" style="display:none">
  <div class="in">
    <h2>Перевал 24</h2>
    <p>Рабочее место менеджера: расчёт рейса, заведение рейсов и контрагентов в общую базу</p>
    <label for="gWho">Как тебя зовут</label>
    <input id="gWho" placeholder="имя менеджера, им подписываются записи">
    <label for="gKey">Ключ доступа к базе</label>
    <input id="gKey" type="password" placeholder="тот же, что в форме договора">
    <button class="btn" id="gSave">Войти</button>
    <button class="btn ghost" id="gSkip">Только калькулятор, без базы</button>
    <p class="tiny">Ключ хранится в этом телефоне и уходит только на сервер Перевал 24.
      Ключ выдаёт руководитель. Без ключа работает калькулятор, а рейсы и справочник
      будут недоступны</p>
  </div>
</div>

<script src="app.js?v=6"></script>
</body>
